name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # TODO: pin actions by SHA with ratchet.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  build-pypi:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - {goos: "linux", goarch: "amd64"}
          - {goos: "linux", goarch: "arm64"}
          - {goos: "darwin", goarch: "amd64"}
          - {goos: "darwin", goarch: "arm64"}
          - {sdist: true}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - env:
          MATRIX_GOOS: ${{ matrix.target.goos }}
          MATRIX_GOARCH: ${{ matrix.target.goarch }}
          MATRIX_SDIST: ${{ matrix.target.sdist }}
        run: |
          if [ "$MATRIX_SDIST" = "true" ]; then
            uv build --sdist --build-constraints build-constraints.txt
          else
            GOOS="$MATRIX_GOOS" GOARCH="$MATRIX_GOARCH" \
              uv build --wheel --build-constraints build-constraints.txt
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.target.goos || 'sdist' }}-${{ matrix.target.goarch || 'source' }}
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    needs: build-pypi
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: uv publish dist/*
