name: Report card site

on:
  schedule:
    - cron: "0 9 * * *" # nightly, ~1am PT
  workflow_dispatch:

permissions: {}

concurrency:
  group: report-card-site
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # TODO: pin actions by SHA with ratchet before enabling branch protection.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # no push token while parsing untrusted AUR content
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .cache
          key: aur-snapshots-${{ github.run_id }}
          restore-keys: aur-snapshots-
      # The corpus is every base the AUR has seen a change to in the last 90
      # days: ~23,600, still far more than one run can download. Widening the
      # window is a one-line change and the state carries over, so this can
      # grow later — 180d is ~35,000 bases and a year is ~47,600.
      #
      # data/state.jsonl carries the previous scan, so a base whose
      # LastModified has not moved is served from it without a fetch, and
      # -budget caps the rest. 8000 comes from the request throttle rather than
      # the runner: fetches are spaced 500ms apart globally, so the ceiling is
      # 2/s no matter what -jobs says, and measured throughput is nearer 1/s.
      # That puts a full budget at roughly two hours, well inside the 6h job
      # limit. From an empty state the corpus fills in about three nights;
      # after that a run fetches only the bases that actually changed and
      # finishes in minutes, with the budget never binding.
      #
      # -deadline caps the run's wall clock: past it the run stops starting
      # fetches and finishes with what it has, so the site and state still
      # land instead of the job dying at the 6h kill limit with everything
      # uncommitted. Unfetched bases simply roll to the next run, same as
      # over-budget ones, so the state advances a little every night no matter
      # what. At 1h the deadline, not the budget, is what bounds a fill-in
      # night (~3600 fetches at the throttle's pace), stretching a
      # from-empty fill over about a week — the price of never tying up a
      # runner for longer than an hour. The generator logs progress with a
      # rate and ETA as it fetches, so a run that is merely slow is
      # distinguishable from one that is stuck.
      - run: >
          go run ./site
          -maintainer Jamison
          -since-days 90
          -top 500
          -budget 8000
          -deadline 1h
          -state data/state.jsonl
          -out docs
      - uses: actions/upload-artifact@v6
        with:
          # Both paths, so their least common ancestor is the workspace root and
          # the publish job can restore them where they belong.
          path: |
            docs
            data/state.jsonl
          name: report-card-docs
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true # docs/.nojekyll must ride along

  publish:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # TODO: pin actions by SHA with ratchet before enabling branch protection.
      - uses: actions/checkout@v6 # default token persists — needed for git push
      - uses: actions/download-artifact@v6
        with:
          name: report-card-docs
          path: . # the artifact holds docs/ and data/ already
      - name: Commit refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The state must be committed alongside the pages it produced, or the
          # next run rescans everything this one just did.
          git add docs data
          if git diff --cached --quiet; then
            echo "No changes to the report card."
          else
            git commit -m "Regenerate report card site"
            git push
          fi
